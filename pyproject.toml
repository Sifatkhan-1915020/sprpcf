[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprpcf"
version = "0.1.0"
description = "A Universal Research-Grade Python Library for SPR Biosensor Design, Geometry Modeling, Material Engineering, Meshing, FEM Simulation, Mode Analysis, Visualization, Optimization and Research Reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SPR-PCF Studio Scientific Engineering Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "shapely>=2.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "h5py>=3.8.0",
    "meshio>=5.3.0",
]

[project.urls]
Homepage = "https://github.com/Sifatkhan-1915020/sprpcf"
Repository = "https://github.com/Sifatkhan-1915020/sprpcf"
"Bug Tracker" = "https://github.com/Sifatkhan-1915020/sprpcf/issues"

[project.optional-dependencies]
fem = [
    "ngsolve>=6.2.0",
    "netgen-mesher>=6.2.0",
]
gmsh = [
    "gmsh>=4.11.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "sprpcf[fem,gmsh,test]"
]

[project.scripts]
sprpcf = "sprpcf.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

